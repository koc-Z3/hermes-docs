name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check: T3 path validation against the cached llms.txt.
  # Runs on every PR. No network calls beyond the optional cache refresh.
  check-paths:
    name: T3 path check (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache llms.txt
        uses: actions/cache@v4
        with:
          path: .cache/llms.txt
          key: llms-${{ github.run_number }}
          restore-keys: llms-

      - name: Refresh llms.txt (best-effort)
        # Don't fail the run if the docs site is down — the cached copy
        # is the fallback.
        run: |
          mkdir -p .cache
          curl -fsSL --max-time 10 \
            "https://hermes-agent.nousresearch.com/docs/llms.txt" \
            -o .cache/llms.txt || \
            echo "::warning::Failed to refresh llms.txt; using cache if present"

      - name: Run T3 path check
        run: bash scripts/check_t3_paths.sh

  # Slow check: live HTTP verification of every T3 path. Runs nightly
  # and on manual dispatch. Skipped on PRs to keep the feedback loop
  # fast and avoid flakiness from transient network issues.
  check-live:
    name: T3 path check (live HTTP)
    runs-on: ubuntu-latest
    needs: check-paths
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Run live T3 path check
        # Live check: 95+ HTTP requests, ~30s wall time. Fails the run
        # if any T3 path returns non-200 on the live docs site.
        run: bash scripts/check_t3_paths.sh --live
        timeout-minutes: 5
